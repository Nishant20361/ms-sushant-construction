name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ms_sushant_test
        options: >-
          --health-cmd "pg_isready -U postgres -d ms_sushant_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ms_sushant_app?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ms_sushant_test?schema=public
      JWT_SECRET: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build
      - run: DATABASE_URL="$TEST_DATABASE_URL" npm run db:migrate
      - run: npx prisma migrate diff --from-url "$TEST_DATABASE_URL" --to-schema-datamodel server/prisma/schema.prisma --exit-code
      - run: npm test
      - run: node --test scripts/package.test.mjs
      - run: npm audit --omit=dev --audit-level=high

  mobile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        app: [mobile, admin-mobile]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test --if-present
      - run: npx expo export --platform android --output-dir /tmp/expo-export
        env:
          CI: 1
          EXPO_NO_DOTENV: 1
