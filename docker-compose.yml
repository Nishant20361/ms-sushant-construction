# Local PostgreSQL for development. The application already uses PostgreSQL.
# Start with: docker compose up -d
# DATABASE_URL=postgresql://sushant:sushant@localhost:5432/sushant_construction?schema=public
services:
  db:
    image: postgres:16-alpine
    container_name: ms-sushant-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: sushant
      POSTGRES_PASSWORD: sushant
      POSTGRES_DB: sushant_construction
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - ms_sushant_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sushant -d sushant_construction"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ms_sushant_pgdata:

